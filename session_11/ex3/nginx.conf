# Server Block 1: Redirect toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    server_name api.my-ecommerce.com;

    return 301 https://$host$request_uri;
}

# Server Block 2: Cấu hình HTTPS (Port 443)
server {
    listen 443 ssl;
    server_name api.my-ecommerce.com;

    # Đường dẫn chứng chỉ SSL/TLS được cấp bởi Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/api.my-ecommerce.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.my-ecommerce.com/privkey.pem;

    # Cấu hình giao thức mã hóa an toàn
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://localhost:8080;
        
        # Chuyển tiếp Header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}