version: '3.8'

services:
  quickbite-user:
    build: ./user-service
    ports:
      - "${USER_SERVER_PORT}:8081"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${USER_DB_NAME}
      - DB_USERNAME=${USER_DB_USERNAME}
      - DB_PASSWORD=${USER_DB_PASSWORD}
    entrypoint: []
    command: ["java","-cp","/app/app.jar","org.springframework.boot.loader.JarLauncher"]
    networks:
      - quickbite-net

  quickbite-restaurant:
    build: ./restaurant-service
    ports:
      - "${RESTAURANT_SERVER_PORT}:8082"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${RESTAURANT_DB_NAME}
      - DB_USERNAME=${RESTAURANT_DB_USERNAME}
      - DB_PASSWORD=${RESTAURANT_DB_PASSWORD}
    entrypoint: []
    command: ["java","-cp","/app/app.jar","org.springframework.boot.loader.JarLauncher"]
    networks:
      - quickbite-net

  quickbite-order:
    build: ./order-service
    ports:
      - "${ORDER_SERVER_PORT}:8083"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${ORDER_DB_NAME}
      - DB_USERNAME=${ORDER_DB_USERNAME}
      - DB_PASSWORD=${ORDER_DB_PASSWORD}
    entrypoint: []
    command: ["java","-cp","/app/app.jar","org.springframework.boot.loader.JarLauncher"]
    networks:
      - quickbite-net

  quickbite-notification:
    build: ./notification-service
    ports:
      - "${NOTIFICATION_SERVER_PORT}:8084"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${NOTIFICATION_DB_NAME}
      - DB_USERNAME=${NOTIFICATION_DB_USERNAME}
      - DB_PASSWORD=${NOTIFICATION_DB_PASSWORD}
    entrypoint: []
    command: ["java","-cp","/app/app.jar","org.springframework.boot.loader.JarLauncher"]
    networks:
      - quickbite-net

networks:
  quickbite-net:
    external: true